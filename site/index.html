<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bedrock Price Tracker</title>
<meta name="description" content="Daily Amazon Bedrock model list prices, new-model detection and comparison against baseline models.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="assets/logos/bedrock.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="bg-aurora"></div>
  <div class="bg-grid"></div>
  <div class="bg-noise"></div>
</div>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="#top" aria-label="Bedrock Price Tracker home">
      <span class="brand-mark"><img src="assets/logos/bedrock.svg" alt="" width="26" height="26"></span>
      <span class="brand-text">
        <span class="brand-name">Bedrock<b>/</b>Price&nbsp;Tracker</span>
        <span class="brand-sub">On-demand list prices · USD per 1M tokens</span>
      </span>
    </a>
    <div class="topbar-status" id="status"></div>
    <nav class="topbar-links">
      <a href="#landscape">Landscape</a>
      <a href="#events">Events</a>
      <a href="#registry">Registry</a>
      <a class="ext" href="https://aws.amazon.com/bedrock/pricing/" target="_blank" rel="noopener">AWS pricing ↗</a>
    </nav>
  </div>
</header>

<main id="top" class="wrap">
  <section class="hero" aria-label="Overview">
    <article class="panel spotlight" id="spotlight"></article>
    <div class="hero-side">
      <div class="tiles" id="tiles"></div>
      <article class="panel health" id="health"></article>
    </div>
  </section>

  <section class="lineups" id="lineups" aria-label="Model lineups"></section>

  <div class="deck" id="deck" role="toolbar" aria-label="Filters"></div>

  <section class="grid-2">
    <article class="panel" id="landscape"></article>
    <article class="panel events" id="events"></article>
  </section>

  <article class="panel" id="delta"></article>
  <article class="panel" id="registry"></article>

  <footer class="footer" id="footer"></footer>
</main>

<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Model detail">
  <div class="drawer-scrim" data-close></div>
  <div class="drawer-panel" role="dialog" aria-modal="true" tabindex="-1"></div>
</aside>
<div class="tooltip" id="tooltip" role="tooltip" hidden></div>
<div class="boot" id="boot"><div class="boot-ring"></div><span>Syncing price feed…</span></div>

<script type="module" src="app.js"></script>
</body>
</html>
